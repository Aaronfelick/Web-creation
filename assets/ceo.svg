<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Portrait of Ug Thottappilly Menon, Founder & CEO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16201b"/>
      <stop offset="1" stop-color="#0a0d0c"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa744"/>
      <stop offset="1" stop-color="#1fbecf"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#1fbecf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1fbecf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#halo)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="400" y2="125"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="375" x2="400" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="500"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
  </g>
  <!-- shoulders -->
  <path d="M70 500 C70 400 130 360 200 360 C270 360 330 400 330 500 Z" fill="url(#grad)" opacity="0.9"/>
  <path d="M85 500 C85 410 135 375 200 375 C265 375 315 410 315 500 Z" fill="#0a0d0c"/>
  <!-- neck -->
  <rect x="178" y="300" width="44" height="80" rx="20" fill="#cdd6d0"/>
  <!-- head -->
  <ellipse cx="200" cy="225" rx="78" ry="90" fill="#dbe3dd"/>
  <!-- hair -->
  <path d="M122 215 C118 150 160 120 200 120 C240 120 282 150 278 215 C278 180 250 165 200 165 C150 165 122 180 122 215 Z" fill="#1b211d"/>
  <path d="M124 220 C124 185 150 170 200 170 C250 170 276 185 276 220 L276 200 C276 150 240 128 200 128 C160 128 124 150 124 200 Z" fill="#222b26"/>
  <!-- glasses -->
  <g fill="none" stroke="#0a0d0c" stroke-width="4" opacity="0.85">
    <rect x="150" y="218" width="42" height="30" rx="10"/>
    <rect x="208" y="218" width="42" height="30" rx="10"/>
    <line x1="192" y1="230" x2="208" y2="230"/>
  </g>
  <!-- ring accent -->
  <circle cx="200" cy="225" r="120" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 10"/>
</svg>
